# ============================================================================
# SonarQube 분석 설정 (ssccops#231)
#
# **왜 워크플로가 아니라 이 파일인가.** 프로젝트 키·분석 대상·제외 목록은 배포마다
# 달라지는 값이 아니라 **저장소의 속성**이다. 예전에는 워크플로의 인라인 `-D` 인자에
# 있었고 키를 `${{ vars.SONAR_PROJECT }}`로 받았는데, 그 변수는 어느 레포에도 등록된 적이
# 없어 **빈 키로 스캔이 돌 뻔했다** — 없으면 실패하는 것이 아니라 조용히 빈 값이 된다.
# 여기에 박으면 잊어버릴 자리가 없다.
#
# SonarScanner CLI가 `sonar.projectBaseDir`(기본값 저장소 루트)에서 이 파일을 자동으로
# 읽는다. 워크플로에는 CI 실행마다 달라지는 것만 남긴다(토큰·호스트).
#
# 값을 여러 줄로 나누지 않는다 — java.util.Properties의 `\` 이어쓰기가 되기는 하지만,
# 스캐너를 로컬에서 돌려 확인할 수 없는 파일이라 해석이 갈릴 여지를 두지 않는다.
# ============================================================================

sonar.projectKey=ssccops-web
sonar.projectName=ssccops-web
sonar.sourceEncoding=UTF-8

# ----------------------------------------------------------------------------
# 분석 대상 — **앱을 나열하지 않는다**
#
# 예전에는 `apps/admin/src,apps/www/src,packages/form-renderer/src`처럼 적었고 그래서
# `apps/lms`가 통째로 빠져 있었다(ssccops#190에서 발견). `integrate.yml`이 검증 명령을
# 전부 루트 turbo로 도는 이유와 같은 함정이며, 그 파일 주석이 이미 경고하고 있다 —
# *"앱 이름을 여기에 적어 두면 새 앱이 조용히 검증에서 빠진다."*
#
# 그래서 루트 전체를 대상으로 두고 **빼는 쪽만 관리한다.** 앱이 늘어도 이 파일을 고칠
# 필요가 없고, 빠뜨리면 분석 결과가 늘어나 드러난다(줄어들어 조용해지지 않는다).
# ----------------------------------------------------------------------------
sonar.sources=.

# 빌드 산출물·도구 디렉터리·비공개 작업 폴더. 대부분 .gitignore에도 있다.
# `next-env.d.ts`·`cloudflare-env.d.ts`는 생성 파일이라 고칠 수 없는데 지적만 쌓인다
# (lint도 그 파일의 경고를 이미 무시하고 있다).
sonar.exclusions=**/node_modules/**,**/.next/**,**/.open-next/**,**/.wrangler/**,**/.turbo/**,**/out/**,**/build/**,**/dist/**,**/coverage/**,**/next-env.d.ts,**/cloudflare-env.d.ts,private-workspace/**,.agents/**,.claude/**,.gemini/**,.omc/**

# ----------------------------------------------------------------------------
# TypeScript — tsconfig도 와일드카드로 잡아 앱이 늘어도 따라온다.
# ----------------------------------------------------------------------------
sonar.typescript.tsconfigPaths=apps/*/tsconfig.json,packages/*/tsconfig.json

# ----------------------------------------------------------------------------
# 커버리지
#
# **지금은 커버리지가 없다** — 이 저장소에 테스트 러너가 아직 없고(AGENTS.md), CI의 test
# job도 테스트 파일이 있을 때만 돈다. 경로만 미리 맞춰 두어 러너가 붙는 날 따로 손대지
# 않게 한다.
#
# 경로가 `apps/*/coverage/`인 것은 analyze job이 test job의 아티팩트를 **원래 자리로**
# 되돌려 받기 때문이다(`download-artifact`의 path가 `.`). 아티팩트 안의 구조를 여기에
# 옮겨 적으면 업로드 경로를 고치는 날 이 파일이 조용히 어긋난다.
#
# **`sonar.tests`는 두지 않는다.** `sonar.sources=.`와 함께 `sonar.tests=.`을 두면 같은
# 파일이 두 번 색인돼 스캔이 실패하는 것으로 알려져 있다. 테스트 러너가 붙는 날
# 소스와 테스트 경로를 함께 가른다.
# ----------------------------------------------------------------------------
sonar.javascript.lcov.reportPaths=apps/*/coverage/lcov.info,packages/*/coverage/lcov.info
