# 모노레포 워크스페이스 — apps/* 는 배포 단위 앱, packages/* 는 두 앱이 함께 쓰는 공유 패키지
# (packages/form-renderer = 폼 렌더러 · #152).
packages:
  - apps/*
  - packages/*

# pnpm 10 은 의존성의 빌드 스크립트를 기본 차단한다 — 실행을 허용할 것만 명시한다.
# (이 설정은 워크스페이스 루트에서만 읽힌다.)
onlyBuiltDependencies:
  - esbuild
  - workerd
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
