name: "🧹 Chore"
description: "문서 · 테스트 · CI/CD · 빌드 설정 등 화면 동작과 무관한 작업"
title: "[CHORE] "
labels: ["chore"]
type: SubTask
body:
  - type: markdown
    attributes:
      value: |
        제목 앞 `[CHORE]`를 **지우지 마세요.** 이 접두사로 브랜치와 라벨이 자동 생성됩니다.

        생성 후 상단 **Parent issue**에서 `ssccops`의 Story·Task를 연결하세요 —
        Epic에 닿지 않는 이슈는 어디에도 잡히지 않습니다(ssccops ADR 0002).

        커밋 타입이 `docs`·`test`·`cicd`·`chore`인 작업이 전부 여기 해당합니다.
        **세부 종류는 등록 후 라벨로 구분하세요** (`docs`·`test`·`cicd`) — 묻는 것이 같은 일을
        템플릿으로 다시 가르지 않습니다.

  - type: dropdown
    id: target
    attributes:
      label: 📦 대상
      description: 모노레포라 어느 앱인지가 경로를 정합니다.
      options:
        - "apps/admin — 운영관리 어드민"
        - "apps/www — 공개 행사"
        - "apps/lms"
        - "packages/* — 앱 사이 공유"
        - "루트 설정 — turbo · pnpm workspace · tsconfig"
        - "여러 곳"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 📄 설명
      description: |
        **무엇이 불편했는지.** 문서·설정 작업도 이유가 있습니다 — 무엇을 찾지 못했는지,
        어떤 빌드가 왜 깨졌는지.
      placeholder: |
        모노레포 전환 뒤 `AGENTS.md`가 아직 평면 구조 경로(`src/features/...`)를 적고 있어,
        그것을 읽고 작업하면 없는 경로를 고치게 된다.
    validations:
      required: true

  - type: textarea
    id: work
    attributes:
      label: ✅ 작업할 내용
      description: 체크박스로 씁니다.
      value: |
        - [ ]
        - [ ]
      placeholder: |
        - [ ] `AGENTS.md`의 경로를 `apps/admin/src/...`로 고친다
        - [ ] 검증 명령을 `pnpm --filter admin ...` 형태로 갱신한다
    validations:
      required: true

  - type: textarea
    id: precheck
    attributes:
      label: 🔍 먼저 확인할 것
      description: |
        CI·빌드 설정 변경이면 **무엇으로 검증하는가**를 적습니다. 문서 작업이면 비워 두세요.
      placeholder: |
        - [ ] 워크플로 변경은 브랜치에 푸시해 실제로 도는 것을 확인한다 — 문법이 맞아도 안 돌 수 있다
        - [ ] `pnpm build`가 모든 앱에서 통과하는가
    validations:
      required: false

  - type: textarea
    id: refs
    attributes:
      label: 🙋🏻 참고 자료
      description: 상위 이슈, 관련 파일 경로.
      placeholder: |
        - 상위: SoongSilComputingClub/ssccops#152
        - `AGENTS.md` · `turbo.json`
    validations:
      required: false
