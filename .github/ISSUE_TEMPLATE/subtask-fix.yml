name: "🧩 Fix"
description: "결함 수정 및 기타 수정"
title: "[FIX] "
labels: ["fix"]
type: SubTask
body:
  - type: markdown
    attributes:
      value: |
        제목 앞 `[FIX]`를 **지우지 마세요.** 이 접두사로 브랜치(`fix/#번호-...`)와 라벨이 자동 생성됩니다.
        원인 분석이 `ssccops`의 Bug 이슈에 있으면 상단 **Parent issue**로 연결하세요.

  - type: dropdown
    id: target
    attributes:
      label: 📦 대상
      description: 모노레포라 어느 앱인지가 경로를 정합니다.
      options:
        - "apps/admin — 운영관리 어드민"
        - "apps/www — 공개 행사"
        - "apps/lms"
        - "packages/* — 앱 사이 공유"
        - "루트 설정 — turbo · pnpm workspace · tsconfig"
        - "여러 곳"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 📄 설명
      description: |
        **무엇이 잘못됐고 왜 그런지.** 증상만 적으면 고치는 사람이 원인을 다시 찾습니다.
        서버 응답과 화면 중 어느 쪽 문제인지 갈랐으면 그 근거도 적으세요.
      placeholder: |
        폼 편집 화면에서 자동저장이 키 입력마다 PUT을 보내, 아무도 문항을 안 고쳤는데도
        문항 버전이 계속 올라간다. 서버는 요청대로 저장했을 뿐이고, 화면이 "바뀐 것이 없다"를
        판단하지 않는 것이 원인이다.
    validations:
      required: true

  - type: textarea
    id: work
    attributes:
      label: ✅ 작업 항목
      description: 무엇을 고치면 끝나는가. 체크박스로 씁니다.
      value: |
        - [ ]
        - [ ]
      placeholder: |
        - [ ] 문항 구성이 실제로 달라졌을 때만 저장 요청을 보낸다
        - [ ] 회귀 확인: 편집 없이 화면을 열었다 닫으면 버전이 그대로다
    validations:
      required: true

  - type: textarea
    id: rejected
    attributes:
      label: 🚫 검토했으나 택하지 않은 길
      description: |
        같은 제보가 다시 올라오는 것을 막는 칸입니다. **"왜 그 뻔한 방법으로 안 고쳤나"에 대한 답**을
        남기세요. 비워 둬도 됩니다.
      placeholder: |
        | 후보 | 왜 안 되는가 |
        |---|---|
        | 자동저장 주기를 늘린다 | 횟수만 줄고 원인(바뀐 것이 없어도 보낸다)은 그대로다 |
    validations:
      required: false

  - type: textarea
    id: precheck
    attributes:
      label: 🔍 먼저 확인할 것
      description: 착수 전에 확인이 필요한 것. 서버 쪽 수정이 선행이면 그 이슈 번호를 적으세요.
      placeholder: |
        - [ ] 서버가 이미 같은 판정을 하고 있는가 — 하고 있으면 화면은 요청만 줄이면 된다
    validations:
      required: false

  - type: textarea
    id: refs
    attributes:
      label: 🙋🏻 참고 자료
      description: 상위 Bug 이슈, 관련 코드 경로, 재현 화면.
      placeholder: |
        - 상위: SoongSilComputingClub/ssccops#152
        - `apps/admin/src/features/form/model/use-form-editor.ts`
    validations:
      required: false
