# ============================================================================
# Frontend Integration Workflow
# ============================================================================
# 역할:
#   - 의존성 설치 및 캐싱 (pnpm)
#   - TypeScript 타입 체크 + ESLint 정적 분석
#   - 테스트 수행 및 커버리지 생성 (테스트 파일이 있을 때만)
#   - SonarQube 코드 품질/커버리지/보안 분석 (토큰이 설정된 경우에만)
#   - 프로덕션 빌드 검증
#
# Job 구조:
#   lint ──┬──> build
#          ├──> analyze
#   test ──┘
#
#   analyze(SonarQube)는 build를 막지 않는다. 코드 품질 리포트가 없다고 해서
#   "이 브랜치가 빌드되는가"라는 판정까지 함께 막을 이유가 없다.
#
# GitHub Secrets (없으면 analyze는 건너뛴다):
#   - SONAR_TOKEN        : SonarQube Token
#   - SONAR_HOST_URL     : SonarQube Server URL (e.g., https://sonar.example.com)
#
# GitHub Variables:
#   - SONAR_PROJECT              : SonarQube Project Key
#   - NEXT_PUBLIC_API_BASE_URL   : ssccops-server 주소 (빌드 검증용, 없어도 빌드는 통과)
#   - NEXT_PUBLIC_SUPABASE_URL   : Supabase 프로젝트 URL
#   - NEXT_PUBLIC_SUPABASE_ANON_KEY : Supabase anon key
#
# 주의:
#   - 이 저장소는 pnpm workspace + Turborepo 모노레포다. 앱은 apps/* 아래에 있고
#     (apps/admin = 운영관리 어드민, apps/events = 공개 행사 앱), 공유 패키지는
#     packages/* 아래에 있다(packages/form-renderer = 폼 렌더러 · #152).
#     pnpm install은 반드시 워크스페이스 루트에서 한다(락파일도 루트 하나뿐이다).
#     검증 명령은 전부 **루트 turbo**로 돌린다 — `pnpm typecheck`(typegen을 선행 태스크로
#     물고 있다) · `pnpm lint` · `pnpm build`. 앱을 새로 추가해도 이 워크플로를 고칠 필요가
#     없게 하려는 것이다(앱 이름을 여기에 적어 두면 새 앱이 조용히 검증에서 빠진다).
#     turbo.json이 NEXT_PUBLIC_* env 선언과 .next 캐시 제외를 관리한다.
#   - 이 저장소는 pnpm을 쓴다(pnpm-lock.yaml). npm ci / cache:'npm' 을 쓰면
#     package-lock.json이 없어 setup-node 단계에서 곧바로 실패한다.
#   - pnpm/action-setup은 반드시 setup-node보다 먼저 와야 cache:'pnpm'이 동작한다.
#   - Prettier 검사 단계는 두지 않는다 — 이 저장소에 prettier 의존성도 설정 파일도 없다.
#     도입한다면 devDependencies와 설정을 먼저 추가하고 여기에 단계를 되살린다.
#   - Next.js는 dist/ 를 만들지 않고(.next), 배포는 Cloudflare Workers Builds가
#     별도로 수행한다. 그래서 빌드 산출물 artifact는 올리지 않고 빌드 성공 여부만 본다.
# ============================================================================

name: Integrate Frontend

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  # ==========================================================================
  # Lint Job - 타입 체크 및 정적 분석
  # ==========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # package.json의 packageManager 필드(pnpm@x.y.z)를 그대로 따른다
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # PageProps/LayoutProps 같은 전역 타입은 Next.js가 .next/types 아래에 생성하고
      # next-env.d.ts가 그것을 참조한다. 새로 체크아웃한 CI에는 .next가 없어 tsc가
      # 'Cannot find name PageProps'로 죽으므로, 전체 빌드 없이 타입만 먼저 만든다.
      # 루트 `pnpm typecheck`(= turbo run typecheck)는 typegen을 선행 태스크로 물고 있어
      # 앱마다 typegen → tsc 순서가 자동으로 지켜진다.
      - name: Run TypeScript Check (typegen + tsc, 모든 앱)
        run: pnpm typecheck

      - name: Run ESLint (모든 앱)
        run: pnpm lint

  # ==========================================================================
  # Test Job - 테스트 및 커버리지
  # ==========================================================================
  test:
    name: Test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 테스트 러너를 아직 도입하지 않았다. 테스트 파일이 생기기 전까지는 이 job이
      # 통과만 하고 지나가며, 파일이 생겼는데 스크립트가 없으면 그때 드러나게 둔다.
      # 앱 하나가 아니라 apps/*/src 와 packages/*/src 전체를 본다 — 새 앱·새 공유 패키지의
      # 첫 테스트가 조용히 안 돌면 러너를 붙였다고 착각한 채 지나간다.
      - name: Check for test files
        id: check-tests
        run: |
          if find apps/*/src packages/*/src -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.spec.ts' -o -name '*.spec.tsx' | grep -q .; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "No test files found, skipping tests"
          fi

      - name: Run Test with Coverage (lcov)
        if: steps.check-tests.outputs.has_tests == 'true'
        run: pnpm -r test:coverage

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            apps/*/coverage/
            packages/*/coverage/
          if-no-files-found: ignore

  # ==========================================================================
  # Analyze Job - SonarQube 분석 (토큰이 없으면 건너뛴다)
  # ==========================================================================
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    needs: [lint, test]

    permissions:
      contents: read
      pull-requests: write

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    steps:
      - name: Skip notice
        if: env.SONAR_TOKEN == ''
        run: |
          echo "SONAR_TOKEN이 설정되지 않아 SonarQube 분석을 건너뜁니다." >> $GITHUB_STEP_SUMMARY

      - name: Checkout source
        if: env.SONAR_TOKEN != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarQube 분석을 위해 전체 히스토리 필요

      - name: Cache SonarQube packages
        if: env.SONAR_TOKEN != ''
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Download test results
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-results
          path: coverage/

      - name: SonarQube Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT }}
            -Dsonar.sources=apps/admin/src,apps/events/src,packages/form-renderer/src
            -Dsonar.exclusions=**/node_modules/**,**/.next/**,**/*.test.ts,**/*.test.tsx
            -Dsonar.typescript.tsconfigPath=apps/admin/tsconfig.json,apps/events/tsconfig.json,packages/form-renderer/tsconfig.json
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

      - name: SonarQube Quality Gate + PR Comment (Community)
        if: env.SONAR_TOKEN != '' && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
        run: |
          set -e

          REPORT_FILE=".scannerwork/report-task.txt"

          if [ ! -f "$REPORT_FILE" ]; then
            echo "report-task.txt not found"
            exit 1
          fi

          # ------------------------------------------------------------------
          # Basic info from report-task.txt
          # ------------------------------------------------------------------
          CE_TASK_ID=$(grep '^ceTaskId=' $REPORT_FILE | cut -d'=' -f2)
          PROJECT_KEY=$(grep '^projectKey=' $REPORT_FILE | cut -d'=' -f2)
          DASHBOARD_URL=$(grep '^dashboardUrl=' $REPORT_FILE | cut -d'=' -f2-)

          echo "ProjectKey: $PROJECT_KEY"
          echo "Branch: $BRANCH"

          # ------------------------------------------------------------------
          # Wait for CE task
          # ------------------------------------------------------------------
          for i in {1..30}; do
            STATUS_JSON=$(curl -s -u "$SONAR_TOKEN:" \
              "$SONAR_HOST_URL/api/ce/task?id=$CE_TASK_ID")

            TASK_STATUS=$(echo "$STATUS_JSON" | jq -r '.task.status')

            if [ "$TASK_STATUS" = "SUCCESS" ]; then
              break
            fi

            echo "Waiting for SonarQube task... ($i)"
            sleep 5
          done

          ANALYSIS_ID=$(echo "$STATUS_JSON" | jq -r '.task.analysisId')

          # ------------------------------------------------------------------
          # Quality Gate
          # ------------------------------------------------------------------
          QG_JSON=$(curl -s -u "$SONAR_TOKEN:" \
            "$SONAR_HOST_URL/api/qualitygates/project_status?analysisId=$ANALYSIS_ID")

          QG_STATUS=$(echo "$QG_JSON" | jq -r '.projectStatus.status')

          # ------------------------------------------------------------------
          # Branch-level Issues (SAFE)
          # ------------------------------------------------------------------
          ISSUES_JSON=$(curl -s -u "$SONAR_TOKEN:" \
            "$SONAR_HOST_URL/api/issues/search?projectKeys=$PROJECT_KEY&branch=$BRANCH&resolved=false")

          BUGS=$(echo "$ISSUES_JSON" | jq '[ (.issues // [])[] | select(.type=="BUG") ] | length')
          VULNS=$(echo "$ISSUES_JSON" | jq '[ (.issues // [])[] | select(.type=="VULNERABILITY") ] | length')
          SMELLS=$(echo "$ISSUES_JSON" | jq '[ (.issues // [])[] | select(.type=="CODE_SMELL") ] | length')

          # ------------------------------------------------------------------
          # Branch-level Measures (SAFE)
          # ------------------------------------------------------------------
          MEASURES_JSON=$(curl -s -u "$SONAR_TOKEN:" \
            "$SONAR_HOST_URL/api/measures/component?component=$PROJECT_KEY&branch=$BRANCH&metricKeys=coverage,duplicated_lines_density")

          COVERAGE=$(echo "$MEASURES_JSON" | jq -r '.component.measures // [] | map(select(.metric=="coverage")) | .[0].value // "0"')
          DUPLICATION=$(echo "$MEASURES_JSON" | jq -r '.component.measures // [] | map(select(.metric=="duplicated_lines_density")) | .[0].value // "0"')

          # ------------------------------------------------------------------
          # Result formatting
          # ------------------------------------------------------------------
          if [ "$QG_STATUS" = "OK" ]; then
            ICON="✅"
            RESULT="PASSED"
          else
            ICON="❌"
            RESULT="FAILED"
          fi

          BODY=$(cat <<EOF
          ## SonarQube Quality Summary (Community)

          ${ICON} **Quality Gate ${RESULT}**

          **Branch:** \`${BRANCH}\`
          **Compared to:** default branch

          ### Issues
          - 🐞 Bugs: ${BUGS}
          - 🔐 Vulnerabilities: ${VULNS}
          - 📎 Code Smells: ${SMELLS}

          ### Measures
          - Coverage: ${COVERAGE}%
          - Duplication: ${DUPLICATION}%

          🔗 Dashboard: ${DASHBOARD_URL}&branch=${BRANCH}

          _Generated automatically by GitHub Actions._
          EOF
          )

          # ------------------------------------------------------------------
          # PR comment
          # ------------------------------------------------------------------
          gh api repos/$REPO/issues/$PR_NUMBER/comments \
            -f body="$BODY"

          # ------------------------------------------------------------------
          # Fail workflow if Quality Gate failed
          # ------------------------------------------------------------------
          if [ "$QG_STATUS" != "OK" ]; then
            echo "Quality Gate FAILED"
            exit 1
          fi

  # ==========================================================================
  # Build Job - 프로덕션 빌드 검증
  # ==========================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # NEXT_PUBLIC_* 는 빌드 시점에 번들로 인라인된다. 값이 없어도 컴파일은 통과하므로
      # 여기서는 빌드가 깨지지 않는지만 본다 — 실제 배포용 값은 Cloudflare Workers Builds가 넣는다.
      # 루트 `pnpm build`는 `turbo run build`다. Turborepo 기본 env 모드가 strict라
      # 여기서 넘긴 NEXT_PUBLIC_* 는 turbo.json build.env 선언이 있어야 태스크에 전달된다.
      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: pnpm build

      - name: Integration Summary
        run: |
          echo "## Integration Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch** : ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit** : ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Node.js**: ${{ env.NODE_VERSION }}" >> $GITHUB_STEP_SUMMARY
