# ============================================================================
# Frontend Integration Workflow
# ============================================================================
# 역할:
#   - 의존성 설치 및 캐싱 (pnpm)
#   - TypeScript 타입 체크 + ESLint 정적 분석
#   - 테스트 수행 및 커버리지 생성 (테스트 파일이 있을 때만)
#   - SonarQube 코드 품질/커버리지/보안 분석 (develop 푸시에서만 · 토큰이 있을 때만)
#   - 프로덕션 빌드 검증
#
# Job 구조:
#   lint ──┬──> build
#          ├──> analyze
#   test ──┘
#
#   analyze(SonarQube)는 build를 막지 않는다. 코드 품질 리포트가 없다고 해서
#   "이 브랜치가 빌드되는가"라는 판정까지 함께 막을 이유가 없다.
#
#   **analyze 는 `develop` 푸시에서만 돈다** (ssccops#238). 이 서버는 SonarQube Community
#   Build 이고 브랜치 플러그인이 없어(ssccops#234) 스캐너가 브랜치를 선언하지 못한다 —
#   **모든 분석이 프로젝트 기본 브랜치 한 자리를 덮어쓴다.** PR 마다 돌리면 그 자리가 PR
#   내용으로 바뀌어 "지금 develop 이 어떤 상태인가"를 아무도 알 수 없고, 그러면 Quality
#   Gate 를 잠글 기준을 만들 수 없다(ssccops#235). 머지된 상태만 분석한다.
#   **Quality Gate가 빨개도 막지 않는다**(ssccops#231) — 기존 코드의 지적을 다 갚기 전에
#   잠그면 아무것도 머지할 수 없다. 숫자를 보고 기준을 정한 뒤에 잠근다.
#
# GitHub Secrets (없으면 analyze는 건너뛴다):
#   - SONAR_TOKEN        : SonarQube Token
#   - SONAR_HOST_URL     : SonarQube Server URL (e.g., https://sonar.example.com)
#
# SonarQube 분석 설정은 저장소 루트의 sonar-project.properties 에 있다 — 프로젝트 키·분석
# 대상·제외 목록은 배포마다 달라지는 값이 아니라 저장소의 속성이다. 예전에는 키를
# vars.SONAR_PROJECT 로 받았는데 그 변수가 등록된 적이 없어 빈 키로 돌 뻔했다.
#
# GitHub Variables:
#   - NEXT_PUBLIC_API_BASE_URL   : ssccops-server 주소 (빌드 검증용, 없어도 빌드는 통과)
#   - NEXT_PUBLIC_SUPABASE_URL   : Supabase 프로젝트 URL
#   - NEXT_PUBLIC_SUPABASE_ANON_KEY : Supabase anon key
#
# 주의:
#   - 이 저장소는 pnpm workspace + Turborepo 모노레포다. 앱은 apps/* 아래에 있고
#     (apps/admin = 운영관리 어드민, apps/www = 공개 웹사이트), 공유 패키지는
#     packages/* 아래에 있다(packages/form-renderer = 폼 렌더러 · #152).
#     pnpm install은 반드시 워크스페이스 루트에서 한다(락파일도 루트 하나뿐이다).
#     검증 명령은 전부 **루트 turbo**로 돌린다 — `pnpm typecheck`(typegen을 선행 태스크로
#     물고 있다) · `pnpm lint` · `pnpm build`. 앱을 새로 추가해도 이 워크플로를 고칠 필요가
#     없게 하려는 것이다(앱 이름을 여기에 적어 두면 새 앱이 조용히 검증에서 빠진다).
#     turbo.json이 NEXT_PUBLIC_* env 선언과 .next 캐시 제외를 관리한다.
#   - 이 저장소는 pnpm을 쓴다(pnpm-lock.yaml). npm ci / cache:'npm' 을 쓰면
#     package-lock.json이 없어 setup-node 단계에서 곧바로 실패한다.
#   - pnpm/action-setup은 반드시 setup-node보다 먼저 와야 cache:'pnpm'이 동작한다.
#   - setup-node v5부터 packageManager 필드를 보고 캐시를 자동으로 켰다가 v6에서 그 자동
#     캐싱을 npm으로만 한정했다. pnpm은 자동으로 잡히지 않으므로 cache:'pnpm'을 계속
#     명시한다 — 지우면 캐시가 조용히 꺼진다.
#   - Prettier 검사 단계는 두지 않는다 — 이 저장소에 prettier 의존성도 설정 파일도 없다.
#     도입한다면 devDependencies와 설정을 먼저 추가하고 여기에 단계를 되살린다.
#   - Next.js는 dist/ 를 만들지 않고(.next), 배포는 Cloudflare Workers Builds가
#     별도로 수행한다. 그래서 빌드 산출물 artifact는 올리지 않고 빌드 성공 여부만 본다.
# ============================================================================

name: Integrate Frontend

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  # ==========================================================================
  # Lint Job - 타입 체크 및 정적 분석
  # ==========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      # package.json의 packageManager 필드(pnpm@x.y.z)를 그대로 따른다
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # PageProps/LayoutProps 같은 전역 타입은 Next.js가 .next/types 아래에 생성하고
      # next-env.d.ts가 그것을 참조한다. 새로 체크아웃한 CI에는 .next가 없어 tsc가
      # 'Cannot find name PageProps'로 죽으므로, 전체 빌드 없이 타입만 먼저 만든다.
      # 루트 `pnpm typecheck`(= turbo run typecheck)는 typegen을 선행 태스크로 물고 있어
      # 앱마다 typegen → tsc 순서가 자동으로 지켜진다.
      - name: Run TypeScript Check (typegen + tsc, 모든 앱)
        run: pnpm typecheck

      - name: Run ESLint (모든 앱)
        run: pnpm lint

  # ==========================================================================
  # Test Job - 테스트 및 커버리지
  # ==========================================================================
  test:
    name: Test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 테스트 러너를 아직 도입하지 않았다. 테스트 파일이 생기기 전까지는 이 job이
      # 통과만 하고 지나가며, 파일이 생겼는데 스크립트가 없으면 그때 드러나게 둔다.
      # 앱 하나가 아니라 apps/*/src 와 packages/*/src 전체를 본다 — 새 앱·새 공유 패키지의
      # 첫 테스트가 조용히 안 돌면 러너를 붙였다고 착각한 채 지나간다.
      - name: Check for test files
        id: check-tests
        run: |
          if find apps/*/src packages/*/src -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.spec.ts' -o -name '*.spec.tsx' | grep -q .; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "No test files found, skipping tests"
          fi

      - name: Run Test with Coverage (lcov)
        if: steps.check-tests.outputs.has_tests == 'true'
        run: pnpm -r test:coverage

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: |
            apps/*/coverage/
            packages/*/coverage/
          if-no-files-found: ignore

  # ==========================================================================
  # Analyze Job - SonarQube 분석 (토큰이 없으면 건너뛴다)
  # ==========================================================================
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    needs: [lint, test]
    # develop 푸시에서만. PR·main·workflow_dispatch 는 제외한다 — 위 Job 구조 주석 참고.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    permissions:
      contents: read

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    steps:
      - name: Skip notice
        if: env.SONAR_TOKEN == ''
        run: |
          echo "SONAR_TOKEN이 설정되지 않아 SonarQube 분석을 건너뜁니다." >> $GITHUB_STEP_SUMMARY

      - name: Checkout source
        if: env.SONAR_TOKEN != ''
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # SonarQube 분석을 위해 전체 히스토리 필요

      - name: Cache SonarQube packages
        if: env.SONAR_TOKEN != ''
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # 커버리지를 **원래 자리로** 되돌려 받는다(`apps/*/coverage/`). 아티팩트 안의 구조를
      # sonar 설정에 옮겨 적으면 업로드 경로를 고치는 날 그쪽이 조용히 어긋난다.
      #
      # download-artifact v8은 다이제스트 불일치를 기본값 error로 다룬다(v7까지는 경고였다).
      # 업로드는 이름으로 하고 있어 v5의 `artifact-ids` 경로 변경과는 무관하고, upload는
      # archive 기본값(zip)을 그대로 쓰므로 v8의 direct download 경로도 타지 않는다.
      - name: Download test results
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: test-results
          path: .

      # 분석 설정은 전부 저장소 루트의 `sonar-project.properties`에 있다 — 스캐너가 그 파일을
      # 자동으로 읽는다. 여기에는 CI 실행마다 달라지는 것(토큰·호스트)만 남긴다.
      # 예전에는 `-Dsonar.projectKey=${{ vars.SONAR_PROJECT }}`였는데 **그 변수가 등록된 적이
      # 없어** 빈 키로 돌 뻔했다. 없으면 실패하는 것이 아니라 조용히 비는 종류다.
      #
      # v8은 GPG 서명 검증이 기본값이다(v7까지는 건너뛰었다). 스캐너 CLI를 내려받는 경로가
      # 막히면 여기서 실패하므로, 실패하면 네트워크·프록시부터 본다.
      - name: SonarQube Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0

      # 리포트 조립은 `.github/scripts/sonar-report.sh` 에 있다. 인라인 bash 를 뺀 이유는
      # 둘이다 — `ssccops-server` 가 같은 자리에 같은 스크립트를 두어 **두 레포의 모양을
      # 맞추기 위해서**이고, 워크플로 YAML 안의 bash 는 `bash -n` 으로 문법 검사조차 할 수
      # 없기 때문이다. 실제로 이 로직이 조용히 틀린 값을 보고한 적이 있다(#306).
      #
      # 리포트는 job 요약에만 남긴다. push 에는 코멘트를 달 PR 이 없다.
      - name: SonarQube Quality Gate report
        if: env.SONAR_TOKEN != ''
        env:
          REF_NAME: ${{ github.ref_name }}
        run: bash .github/scripts/sonar-report.sh

  # ==========================================================================
  # Build Job - 프로덕션 빌드 검증
  # ==========================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # NEXT_PUBLIC_* 는 빌드 시점에 번들로 인라인된다. 값이 없어도 컴파일은 통과하므로
      # 여기서는 빌드가 깨지지 않는지만 본다 — 실제 배포용 값은 Cloudflare Workers Builds가 넣는다.
      # 루트 `pnpm build`는 `turbo run build`다. Turborepo 기본 env 모드가 strict라
      # 여기서 넘긴 NEXT_PUBLIC_* 는 turbo.json build.env 선언이 있어야 태스크에 전달된다.
      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: pnpm build

      - name: Integration Summary
        run: |
          echo "## Integration Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch** : ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit** : ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Node.js**: ${{ env.NODE_VERSION }}" >> $GITHUB_STEP_SUMMARY
