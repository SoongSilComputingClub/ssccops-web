# ============================================================================
# Frontend Deploy Workflow - Dev (GHCR + Coolify)
# ============================================================================
# 역할:
#   - Integrate Frontend 가 develop 푸시에서 끝난 뒤 자동 실행
#   - 루트 Dockerfile 하나로 세 앱(admin · www · lms)의 이미지를 **따로** 빌드해 GHCR 에 푸시
#     (`ssccops-web-{app}` · 태그 `dev` · `sha-<7>`)
#   - 앱마다 Coolify 배포 웹훅을 불러 그 앱이 새 이미지를 받아 기동하게 한다
#
# Job 구조:
#   prepare ──> build-image (admin · www · lms) ──> deploy (admin · www · lms)
#
#   서버 deploy-dev.yml 과 같은 사슬이다. prepare 는 «무엇을 빌드하나(커밋)»와 «빌드해도
#   되나(Lint·Test·Build 결과)»만 판정하고, 판정이 서지 않으면 아래 둘은 실패가 아니라 회색이다.
#
# 트리거:
#   - Integrate Frontend 가 develop 에서 완료됐을 때(conclusion 은 prepare 가 따로 본다)
#   - 수동 실행(workflow_dispatch) — 지금 ref 의 커밋으로 빌드한다. `skip_deploy` 로 이미지만 올린다
#
# **빌드를 Coolify 호스트에서 여기로 옮긴 이유** (#694 · ssccops#515): ADR-0048 A안에서는 빌드 한
# 번이 호스트 메모리 2~4 GB를 써서 동시 빌드 1로 세 앱이 줄을 섰고, 빌드 중에는 같은 호스트의
# 서비스가 2~5배 느려졌다. 또 Coolify GitHub App 의 푸시 웹훅은 CI 를 기다리지 않아 **lint·test 가
# 깨진 커밋도 올라갔다.** 이 경로는 Lint·Test·Build 를 통과한 커밋만 이미지가 된다. 서버 dev 가
# 먼저 간 길(ssccops-server#569 · ssccops#513)이고 사슬도 같은 모양으로 맞췄다.
#
# ── 세 앱을 어떻게 가르나 ───────────────────────────────────────────────────
#
# **이미지를 앱마다 하나씩 만든다.** 이미지 하나에 세 앱을 담고 런타임에 고르는 길은 성립하지
# 않는다 — standalone 산출물은 앱 하나만 담고(Dockerfile 4단계), NEXT_PUBLIC_* 는 빌드 때
# 인라인되므로 컨테이너가 뜬 뒤에는 바꿀 수 없다. Dockerfile 은 여전히 하나이고 `APP` 빌드
# 인자만 matrix 가 바꾼다(#653).
#
# **서브도메인은 이미지가 모른다.** Coolify 애플리케이션 셋이 각자 도메인을 갖고(ADR-0048 —
# test.admin · test.www · test.lms) 각자 자기 이미지를 받는다. 세 컨테이너는 모두 3000 에서
# 듣고, 어느 도메인이 어느 컨테이너로 가는지는 Coolify 의 프록시가 정한다.
#
# **앱이 서로를 가리키는 주소는 변수 한 벌로 충분하다.** `NEXT_PUBLIC_PUBLIC_FORM_ORIGIN` 은 어느
# 앱에서 읽든 www 오리진이고, `_LMS_ORIGIN`·`_ADMIN_ORIGIN` 도 이름마다 값이 하나다(각 앱
# .env.example «같은 이름·같은 값»). 그래서 같은 값을 세 빌드에 똑같이 넘긴다 — 앱은 자기가
# 읽는 이름만 인라인하고 나머지는 번들에 들어가지 않는다.
#
# ── 서버와 가장 크게 다른 점 — 빌드 변수의 정본이 GitHub 으로 온다 ──────────
#
# 서버는 «환경변수 정본은 Coolify, Actions 는 한 개도 넣지 않는다»인데 웹은 그렇게 할 수 없다.
# 앱이 읽는 값이 전부 NEXT_PUBLIC_* 라 **빌드 때 인라인되고, 컨테이너의 런타임 env 는 아무
# 효과가 없다**(코드가 읽는 비-NEXT_PUBLIC 값은 NODE_ENV·VERCEL·커밋 sha 뿐이다). 빌드가
# Actions 로 오면 값도 Actions 가 넘겨야 한다 — Coolify 애플리케이션에 남은 Build Variable 은
# 이 경로에서 읽히지 않는다.
#
# 값은 **GitHub Environment `dev` 의 Variables** 에 둔다. 이름은 각 앱 .env.example · Dockerfile
# ARG 와 같다. Secrets 가 아니라 Variables 인 것은 이 값들이 어차피 브라우저 번들에 그대로 실려
# 나가서다(Supabase anon key 도 공개 키다). **비밀을 여기 넣지 않는다** — 넣으면 번들로 공개된다.
#
# Environment `dev` — Variables:
#   - NEXT_PUBLIC_API_BASE_URL        (필수) ssccops-server dev 주소
#   - NEXT_PUBLIC_SUPABASE_URL        (필수)
#   - NEXT_PUBLIC_SUPABASE_ANON_KEY   (필수)
#   - NEXT_PUBLIC_PUBLIC_FORM_ORIGIN  www 오리진   — 비면 공개 링크·공유 버튼이 안내로 떨어진다
#   - NEXT_PUBLIC_LMS_ORIGIN          lms 오리진   — 비면 어드민의 기획안 버튼이 사라진다
#   - NEXT_PUBLIC_ADMIN_ORIGIN        admin 오리진 — 비면 알림 행이 글자만 남는다
#   - NEXT_PUBLIC_MEMBER_HARD_DELETE  (선택) ADR-0021 — 평소엔 비운다
#   필수 셋이 비면 build-image 가 **실패한다** — 그 이미지는 모든 화면이 CLIENT_CONFIG_MISSING 인
#   앱이고, 고정 태그 `dev` 를 덮어쓰면 다음 재시작이 그것을 받는다.
#   `NEXT_PUBLIC_DEPLOY_ENV` 는 변수로 두지 않고 아래에 `dev` 로 못 박는다 — 이 워크플로가 곧
#   dev 이고, 잊으면 dev 가 prod 아이콘으로 보이고 www 가 검색엔진에 열린다(#413 · #602).
#   `NEXT_PUBLIC_*_SITE_VERIFICATION` 은 prod www 전용이라 넘기지 않는다.
#
# Environment `dev` — Secrets:
#   - COOLIFY_API_TOKEN                : Coolify API 토큰(deploy 권한만). 세 앱이 함께 쓴다
#   - COOLIFY_DEV_ADMIN_DEPLOY_WEBHOOK : 앱마다 하나인 Coolify 배포 웹훅 URL
#   - COOLIFY_DEV_WWW_DEPLOY_WEBHOOK
#   - COOLIFY_DEV_LMS_DEPLOY_WEBHOOK
#       **변수가 아니라 시크릿이다** — 이 레포가 Public 이라 Actions 로그가 공개되고 변수는
#       마스킹되지 않는다. **비어 있으면 그 앱만 배포 호출을 건너뛰고 경고를 남긴다** — 그래서
#       Coolify 리소스를 한 앱씩 옮길 수 있고, 옮기기 전의 앱은 옛 git 빌드 경로가 그대로 돈다.
#   GITHUB_TOKEN 은 GHCR 푸시에 쓰며 기본 제공이다(permissions.packages: write).
#
# GHCR 패키지는 앱마다 하나라 **셋 다 Public** 으로 둔다(레포가 Public 이고 이미지에 비밀이 없다 —
# 들어간 값은 번들로 이미 공개되는 것뿐이다). 첫 푸시 때 생기므로 그 뒤에 한 번씩 바꾼다.
# Private 이면 호스트에 사람 계정 토큰으로 docker login 이 필요해진다.
# ============================================================================

name: Deploy Dev

on:
  workflow_run:
    workflows: ["Integrate Frontend"]
    types: [completed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: 이미지만 GHCR 에 올리고 Coolify 배포는 부르지 않는다
        type: boolean
        default: false

# 취소하지 않는다 — 두 푸시가 겹치면 늦게 끝난 옛 빌드가 고정 태그 `dev` 를 덮어쓸 수 있다.
# 직렬화하면 그 순서가 커밋 순서와 같아진다. 대기 중인 것은 더 새 푸시로 대체된다
# (GitHub 은 pending 을 하나만 남긴다) — 버려지는 것은 이미 낡은 이미지다.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

env:
  # GHCR 은 소문자 경로만 받는데 조직명은 SoongSilComputingClub 이다 — 서버 deploy-dev.yml 과
  # 같은 이유로 못 박는다. 실제 이미지는 여기에 `-{app}` 을 붙인 셋이다.
  IMAGE_PREFIX: ghcr.io/soongsilcomputingclub/ssccops-web

jobs:
  # ==========================================================================
  # Prepare Job - 무엇을 빌드할지, 빌드해도 되는지
  # ==========================================================================
  #
  # **workflow_run 의 `github.sha` 는 기본 브랜치의 머리이지 그 실행의 커밋이 아니다.**
  # 그 값이 SOURCE_COMMIT → 세 앱 `/version` 의 sha 가 되고 deploy-history 가 그것으로
  # «정말 이 커밋이 떴나»를 확인하므로(ADR-0033), 커밋은 이벤트 payload 의 head_sha 에서 읽는다.
  #
  # **판정은 워크플로 전체 conclusion 이 아니라 Lint·Test·Build job 의 결과다.** Integrate
  # Frontend 의 conclusion 에는 Analyze(SonarQube Quality Gate)가 섞여 있는데 그쪽은 «막는 머지가
  # 없다»가 결정이다(ADR-0018 · #516). 전체 결과로 판정하면 게이트 ERROR 하나가 조용히 dev 배포를
  # 멈춰 세운다. Build 를 넣은 것은 서버와 다른 점이다 — 이미지 빌드가 같은 `next build` 를 다시
  # 돌므로(컨테이너 경로 검증 포함 · #688) 거기서 깨진 커밋은 여기서도 깨진다.
  #
  # 통과하지 못하면 실패가 아니라 **건너뜀(회색)** 이다. Integrate Frontend 가 이미 빨간색으로
  # 그 사실을 말하고 있으므로 같은 사실을 두 번 빨갛게 만들지 않는다(sonar-preflight 와 같은 판단).
  prepare:
    name: Prepare
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read # 트리거한 실행의 job 목록을 읽는다

    outputs:
      proceed: ${{ steps.resolve.outputs.proceed }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}

    steps:
      - name: Resolve commit and CI verdict
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -uo pipefail
          # 기본 셸이 `bash -e {0}` 라 gh 호출 하나가 실패하면 판정도 출력도 없이 job 이 죽는다
          # (ssccops-server#573). 종료 코드를 받아 «건너뜀»으로 떨어뜨린다.
          set +e

          # 요구하는 job 이름은 integrate.yml 의 `name:` 그대로다. 그쪽 이름을 바꾸면
          # 여기서 «찾을 수 없다»가 되어 배포가 건너뛰어진다 — 조용히 통과하지는 않는다.
          REQUIRED_JOBS='Lint Test Build'

          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            HEAD_SHA="$GITHUB_SHA"
            PROCEED=true
            echo "수동 실행 — ref ${GITHUB_REF_NAME} 의 커밋 ${HEAD_SHA} 로 빌드한다."
            echo "::warning title=CI 게이트 건너뜀::수동 실행이라 Lint·Test·Build 결과를 보지 않는다."
          else
            HEAD_SHA="$RUN_SHA"
            PROCEED=true

            # develop → main 릴리스 PR 도 head 가 develop 이라 여기까지 온다 — push 만 받는다.
            if [ "$RUN_EVENT" != 'push' ]; then
              echo "::notice::Integrate Frontend 가 push 가 아닌 '${RUN_EVENT}' 로 돌았다 — 배포 대상이 아니다."
              PROCEED=false
            elif [ "$RUN_CONCLUSION" = 'cancelled' ]; then
              echo "::notice::Integrate Frontend 가 취소됐다 — 배포하지 않는다. ${RUN_URL}"
              PROCEED=false
            else
              JOBS=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs?per_page=100" \
                --paginate --jq '.jobs[] | "\(.name)=\(.conclusion)"')
              GH_RC=$?
              if [ "$GH_RC" -ne 0 ]; then
                echo "::warning title=배포 건너뜀::Integrate Frontend 의 job 목록을 읽지 못했다(gh 종료 코드 ${GH_RC}). 판정할 수 없으므로 배포하지 않는다. ${RUN_URL}"
              fi
              for JOB in $REQUIRED_JOBS; do
                CONCLUSION=$(printf '%s\n' "$JOBS" | awk -F= -v n="$JOB" '$1 == n { print $2 }')
                if [ "$CONCLUSION" = 'success' ]; then
                  echo "  $JOB = success"
                else
                  echo "::warning title=배포 건너뜀::Integrate Frontend 의 '${JOB}' job 이 success 가 아니다(${CONCLUSION:-찾을 수 없음}). ${RUN_URL}"
                  PROCEED=false
                fi
              done
            fi
          fi

          SHORT_SHA=$(printf '%s' "$HEAD_SHA" | cut -c1-7)
          {
            echo "proceed=$PROCEED"
            echo "head_sha=$HEAD_SHA"
            echo "short_sha=$SHORT_SHA"
          } >> "$GITHUB_OUTPUT"

          if [ "$PROCEED" != 'true' ]; then
            echo "⏭️ **dev 배포 건너뜀** — 위 경고의 이유다. 이미지도 올리지 않는다." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ==========================================================================
  # Build Image Job - 앱마다 이미지 하나 (matrix)
  # ==========================================================================
  #
  # 세 빌드는 서로를 기다리지 않고 병렬로 돈다. 호스트에서 빌드하던 때(ADR-0048 A안)는 동시 빌드
  # 1 이라 세 앱이 줄을 섰고 빌드 중에는 같은 호스트의 서비스가 2~5배 느려졌다 — 러너에서는 그
  # 제약이 없다. `fail-fast: false` 는 한 앱이 깨졌을 때 나머지 둘의 로그까지 잘리지 않게 한다
  # (배포는 어차피 셋이 다 서야 간다 — 아래 deploy 주석).
  build-image:
    name: Build Image (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: [prepare]
    if: needs.prepare.outputs.proceed == 'true'
    environment: dev
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        app: [admin, www, lms]

    steps:
      - name: Check build variables
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_PUBLIC_FORM_ORIGIN: ${{ vars.NEXT_PUBLIC_PUBLIC_FORM_ORIGIN }}
          NEXT_PUBLIC_LMS_ORIGIN: ${{ vars.NEXT_PUBLIC_LMS_ORIGIN }}
          NEXT_PUBLIC_ADMIN_ORIGIN: ${{ vars.NEXT_PUBLIC_ADMIN_ORIGIN }}
        run: |
          set -uo pipefail
          MISSING=0
          for NAME in NEXT_PUBLIC_API_BASE_URL NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY; do
            if [ -z "${!NAME}" ]; then
              echo "::error title=빌드 변수 없음::Environment dev 의 Variables 에 ${NAME} 이 없다. 이 값 없이 만든 이미지는 모든 화면이 CLIENT_CONFIG_MISSING 이라 올리지 않는다."
              MISSING=1
            fi
          done
          # 오리진 셋은 비어도 앱이 안내로 떨어지며 산다(각 .env.example) — 막지 않고 알리기만 한다.
          for NAME in NEXT_PUBLIC_PUBLIC_FORM_ORIGIN NEXT_PUBLIC_LMS_ORIGIN NEXT_PUBLIC_ADMIN_ORIGIN; do
            [ -n "${!NAME}" ] || echo "::warning title=빌드 변수 비어 있음::${NAME} 이 비어 있다 — 그 주소를 쓰는 링크·버튼이 안내 문구로 떨어진다."
          done
          exit "$MISSING"

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}
          # 고정 태그 `dev` 를 Coolify 가 다시 받고, `sha-<7>` 은 롤백용으로 함께 올려만 둔다.
          # `type=sha` 를 쓰지 않는 것은 metadata-action 이 GITHUB_SHA 를 읽기 때문이다 —
          # workflow_run 에서 그 값은 기본 브랜치의 머리다(위 prepare 주석).
          # `image.source` 라벨은 액션이 알아서 붙이며, GHCR 패키지가 이 레포에 연결되는 것이
          # 그 라벨이다. `title` 은 레포 이름으로 붙으므로 앱 이름으로 덮는다.
          tags: |
            type=raw,value=dev
            type=raw,value=sha-${{ needs.prepare.outputs.short_sha }}
          labels: |
            org.opencontainers.image.title=ssccops-web-${{ matrix.app }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.head_sha }}
            org.opencontainers.image.version=sha-${{ needs.prepare.outputs.short_sha }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          # 러너가 만드는 것은 amd64 이고 동아리방 호스트도 x86_64 다.
          # arm64 호스트로 옮기면 이 줄과 docker/setup-qemu-action 을 함께 본다.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SOURCE_COMMIT 이 `/version` 의 sha 가 되고 deploy-history 가 그것으로 배포를 확인한다.
          # `.git` 을 이미지에 넣지 않는 이유는 .dockerignore 주석에 있다.
          # NEXT_PUBLIC_* 는 여기서 이미지에 굳는다 — 값을 바꾸면 다시 빌드해야 반영된다
          # (Coolify 에서 Redeploy 만 하면 옛 값 그대로다).
          build-args: |
            APP=${{ matrix.app }}
            SOURCE_COMMIT=${{ needs.prepare.outputs.head_sha }}
            NEXT_PUBLIC_DEPLOY_ENV=dev
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_PUBLIC_FORM_ORIGIN=${{ vars.NEXT_PUBLIC_PUBLIC_FORM_ORIGIN }}
            NEXT_PUBLIC_LMS_ORIGIN=${{ vars.NEXT_PUBLIC_LMS_ORIGIN }}
            NEXT_PUBLIC_ADMIN_ORIGIN=${{ vars.NEXT_PUBLIC_ADMIN_ORIGIN }}
            NEXT_PUBLIC_MEMBER_HARD_DELETE=${{ vars.NEXT_PUBLIC_MEMBER_HARD_DELETE }}
          # **캐시 scope 를 앱마다 나눈다.** 기본 scope 하나를 셋이 함께 쓰면 matrix 가 끝날 때마다
          # 서로의 캐시를 덮어써 사실상 캐시가 없는 것과 같다. `turbo prune` 결과(락파일)가 앱마다
          # 달라 설치 레이어를 나눠 쓸 수도 없다.
          cache-from: type=gha,scope=ssccops-web-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=ssccops-web-${{ matrix.app }}

      - name: Image Summary
        env:
          APP: ${{ matrix.app }}
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## Image (${APP})"
            echo "- **Image**  : \`${IMAGE_PREFIX}-${APP}:dev\` · \`${IMAGE_PREFIX}-${APP}:sha-${SHORT_SHA}\`"
            echo "- **Digest** : \`${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # Deploy Job - 앱마다 Coolify 배포 웹훅 호출 (matrix)
  # ==========================================================================
  #
  # **세 이미지가 모두 올라간 뒤에만 부른다**(`needs: build-image` 는 matrix 전체를 기다린다).
  # 한 앱만 새 커밋으로 뜨면 세 앱이 서로 다른 커밋을 가리키고, deploy-history 레코드는 커밋
  # 하나에 세 앱을 함께 싣는다. 같은 커밋에서 한 앱만 깨지는 일은 대개 공유 원인(락파일·
  # Dockerfile·packages/*)이라 부분 배포로 얻는 것도 적다.
  #
  # 레지스트리 푸시는 Coolify 배포를 트리거하지 않으므로(ADR-0048 B안) 배포 호출은 이쪽이 한다.
  # 호스트가 GHCR 을 폴링하는 길(Watchtower 부류)은 택하지 않았다 — Coolify 가 모르는 사이
  # 컨테이너가 바뀌어 상태·헬스체크·롤백과 어긋난다.
  deploy:
    name: Deploy (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: [prepare, build-image]
    environment: dev

    strategy:
      fail-fast: false
      matrix:
        # 식에는 대문자 변환이 없어 시크릿 이름 조각을 함께 적는다.
        include:
          - app: admin
            key: ADMIN
          - app: www
            key: WWW
          - app: lms
            key: LMS

    steps:
      - name: Trigger Coolify deployment
        id: trigger
        env:
          WEBHOOK: ${{ secrets[format('COOLIFY_DEV_{0}_DEPLOY_WEBHOOK', matrix.key)] }}
          WEBHOOK_NAME: COOLIFY_DEV_${{ matrix.key }}_DEPLOY_WEBHOOK
          TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          SKIP_DEPLOY: ${{ github.event.inputs.skip_deploy }}
        run: |
          set -uo pipefail
          # **Actions 의 기본 셸은 `bash -e {0}` 다** (ssccops-server#573). 끄지 않으면 curl 이 0 이
          # 아닌 값으로 끝나는 순간 셸이 즉시 죽어 **아래 오류 처리가 한 줄도 실행되지 않는다.**
          set +e

          # 값은 절대 찍지 않는다 — 길이와 «이상한 문자가 섞였나»만 센다. 붙여넣기 사고
          # (줄바꿈이 딸려 들어감 · 코드 조각을 그대로 넣음)가 이 진단이 없으면 바깥에서 보이지 않는다.
          shape() {
            printf '길이=%s 개행=%s CR=%s 탭=%s 공백=%s' \
              "${#1}" \
              "$(printf '%s' "$1" | tr -cd '\n' | wc -c | tr -d ' ')" \
              "$(printf '%s' "$1" | tr -cd '\r' | wc -c | tr -d ' ')" \
              "$(printf '%s' "$1" | tr -cd '\t' | wc -c | tr -d ' ')" \
              "$(printf '%s' "$1" | tr -cd ' '  | wc -c | tr -d ' ')"
          }

          report_shapes() {
            echo "시크릿 값의 모양 (값 자체는 찍지 않는다):"
            echo "  ${WEBHOOK_NAME}  $(shape "$WEBHOOK_RAW")"
            echo "  COOLIFY_API_TOKEN  $(shape "$TOKEN_RAW")"
          }

          if [ "${SKIP_DEPLOY:-}" = 'true' ]; then
            echo "outcome=skipped-input" >> "$GITHUB_OUTPUT"
            echo "::notice::skip_deploy 입력이라 배포 호출을 건너뛴다 — 이미지는 올라갔다."
            exit 0
          fi

          WEBHOOK_RAW="$WEBHOOK"
          TOKEN_RAW="$TOKEN"

          # 붙여넣기에 딸려 온 줄바꿈·앞뒤 공백을 걷어낸다. **헤더 값 안의 개행은 curl 이
          # 헤더 인젝션으로 보고 요청 자체를 거부한다**(종료 코드 43). 조용히 고치지 않고
          # 달라졌으면 경고를 남긴다 — 시크릿을 제대로 다시 넣게 하기 위해서다.
          WEBHOOK=$(printf '%s' "$WEBHOOK_RAW" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          TOKEN=$(printf '%s' "$TOKEN_RAW" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')

          if [ "$WEBHOOK" != "$WEBHOOK_RAW" ] || [ "$TOKEN" != "$TOKEN_RAW" ]; then
            echo "::warning title=시크릿 값에 군더더기가 있다::줄바꿈이나 앞뒤 공백을 걷어내고 호출한다. 이번엔 넘어가지만 시크릿을 한 줄로 다시 넣을 것."
            report_shapes
          fi

          if [ -z "$WEBHOOK" ]; then
            echo "outcome=skipped-secret" >> "$GITHUB_OUTPUT"
            echo "::warning title=Coolify 배포 호출 건너뜀::${WEBHOOK_NAME} 이 비어 있다. 이미지는 GHCR 에 올라갔고 이 앱의 배포는 여전히 Coolify 의 git 빌드가 한다 — 전환 전이면 정상이다."
            exit 0
          fi

          # URL 을 찍지 않는다 — 이 레포가 Public 이라 Actions 로그가 공개된다. 그래도 **-sS 로
          # 오류 메시지는 살린다**: -s 만 걸면 «왜 실패했는가»까지 사라진다. 그 메시지에 URL 이
          # 섞여 나올 수 있어 URL 모양의 문자열을 출력 전에 가린다 — GitHub 마스킹은 시크릿
          # «전체»와 글자가 맞을 때만 듣기 때문에 조각으로 새는 길을 막는다.
          CURL_ERR="$RUNNER_TEMP/curl-err.txt"
          CURL_BODY="$RUNNER_TEMP/curl-body.txt"
          CURL_HDR="$RUNNER_TEMP/curl-hdr.txt"

          # **POST 다 — GET 이 아니다** (ssccops-server#575). Coolify 의 /api/v1/deploy 는 GET 에서
          # POST 로 바뀌었고, GET 으로 부르면 «405 · allow: POST» 가 돌아온다(v4.3.23 실측).
          HTTP_STATUS=$(curl -sS -o "$CURL_BODY" -D "$CURL_HDR" -w '%{http_code}' \
            --max-time 30 \
            --request POST "$WEBHOOK" \
            --header "Authorization: Bearer $TOKEN" 2>"$CURL_ERR")
          CURL_RC=$?

          # 실패했을 때만 서버가 보낸 설명을 낸다 — 이유는 대개 본문 한 줄에 적혀 있다(#575).
          # 성공 본문은 배포 uuid 뿐이라 찍지 않는다. URL 모양 문자열은 가린다.
          dump_response() {
            echo "응답 헤더:"
            grep -iE '^(allow|content-type|www-authenticate|retry-after):' "$CURL_HDR" | tr -d '\r' | sed 's/^/  /'
            echo "응답 본문:"
            sed -e 's#https\{0,1\}://[^[:space:]"]*#<url>#g' "$CURL_BODY" | head -c 2000 | sed 's/^/  /'
            echo
          }

          # 종료 코드 != 0 은 «요청이 나가지도 않았다» 또는 «전송이 끊겼다»이고, HTTP 상태는
          # «서버가 받고 거절했다»다. 둘을 가르지 않으면 Coolify 를 의심하며 시간을 버린다.
          if [ "$CURL_RC" -ne 0 ]; then
            echo "outcome=failed" >> "$GITHUB_OUTPUT"
            echo "curl 종료 코드: ${CURL_RC} (요청이 서버에 닿지 못했다)"
            sed -e 's#https\{0,1\}://[^[:space:]]*#<url>#g' "$CURL_ERR"
            report_shapes
            echo "::error::Coolify 배포 호출이 curl 종료 코드 ${CURL_RC} 로 실패했다 — 요청이 나가지도 않았다. 위의 «시크릿 값의 모양»부터 볼 것(43 이면 대개 헤더 값 안의 줄바꿈이다)."
            exit 1
          fi

          if [ "${HTTP_STATUS:-0}" -lt 200 ] || [ "${HTTP_STATUS:-0}" -ge 300 ]; then
            echo "outcome=failed" >> "$GITHUB_OUTPUT"
            dump_response
            echo "::error::Coolify 배포 호출이 HTTP ${HTTP_STATUS} 로 실패했다 — 서버가 받고 거절했다. **위의 «응답 본문»이 이유를 말한다.** 이미지는 GHCR 에 있으니 Coolify 에서 손으로 Deploy 하면 된다."
            exit 1
          fi

          echo "outcome=triggered" >> "$GITHUB_OUTPUT"
          echo "Coolify 배포를 호출했다 (HTTP ${HTTP_STATUS})."

      # 배포가 «떴다»를 여기서 확인하지 않는다 — deploy-history.yml 이 세 앱의 `/version` sha 를
      # 폴링해 그 판정을 레코드로 남긴다(ADR-0033). 두 곳에서 같은 것을 기다리면 한쪽 값이 낡는다.
      - name: Deploy Summary
        if: always()
        env:
          APP: ${{ matrix.app }}
          OUTCOME: ${{ steps.trigger.outputs.outcome }}
          HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
          WEBHOOK_NAME: COOLIFY_DEV_${{ matrix.key }}_DEPLOY_WEBHOOK
        run: |
          case "${OUTCOME:-}" in
            triggered)       STATUS='✅ Coolify 배포 호출됨' ;;
            skipped-input)   STATUS='⏭️ 건너뜀 — skip_deploy 입력' ;;
            skipped-secret)  STATUS="⚠️ 건너뜀 — ${WEBHOOK_NAME} 이 비어 있다" ;;
            *)               STATUS='❌ 배포 호출 실패' ;;
          esac

          {
            echo "## Deploy Summary (Dev · ${APP})"
            echo "- **Commit** : \`${HEAD_SHA}\`"
            echo "- **Image**  : \`${IMAGE_PREFIX}-${APP}:dev\` · \`${IMAGE_PREFIX}-${APP}:sha-${SHORT_SHA}\`"
            echo "- **Deploy** : ${STATUS}"
            echo "- **빌드 변수**: Environment \`dev\` 의 Variables 가 정본이다 — 이미지에 굳어 있어 Coolify 에서 바꿔도 반영되지 않는다"
          } >> "$GITHUB_STEP_SUMMARY"
